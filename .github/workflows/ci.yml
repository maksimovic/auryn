name: Continuous Integration

on:
  push:
    branches:
      - 1.5.x
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        operating-system: ['ubuntu-latest']
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-version }}

    runs-on: ${{ matrix.operating-system }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer update --optimize-autoloader --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --display-deprecations --display-phpunit-deprecations --fail-on-deprecation
